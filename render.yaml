# Render Blueprint: Shopify app (web) + BullMQ worker + Postgres + Key Value.
# Spec: https://render.com/docs/blueprint-spec
# Deployed to the shared Render-GTM workspace, so every name carries the
# owner's initials and customer: jn-onsight-*.
projects:
  - name: jn-onsight-shopify
    environments:
      - name: production
        services:
          - type: web
            name: jn-onsight-shopify-web
            runtime: docker
            plan: 0.5c-512mb
            dockerfilePath: ./Dockerfile
            # Uses the Dockerfile CMD: npm run docker-start (prisma migrate deploy, then serve)
            envVars:
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: jn-onsight-shopify-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: jn-onsight-shopify-kv
                  property: connectionString
              - key: SHOPIFY_API_KEY
                sync: false
              - key: SHOPIFY_API_SECRET
                sync: false
              - key: SCOPES
                sync: false
              - key: SHOPIFY_APP_URL
                sync: false

          - type: worker
            name: jn-onsight-shopify-worker
            runtime: docker
            plan: 0.5c-512mb
            dockerfilePath: ./Dockerfile
            dockerCommand: npm run worker
            envVars:
              - key: NODE_ENV
                value: production
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: jn-onsight-shopify-kv
                  property: connectionString
              - key: DATABASE_URL
                fromDatabase:
                  name: jn-onsight-shopify-db
                  property: connectionString

          - type: keyvalue
            name: jn-onsight-shopify-kv
            plan: 256mb
            maxmemoryPolicy: noeviction # BullMQ requires noeviction
            ipAllowList: [] # Internal connections only

        databases:
          - name: jn-onsight-shopify-db
            plan: 0.1c-256mb
